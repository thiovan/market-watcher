[project]
name = "market-watcher"
version = "1.0.0"
description = "Telegram bot for tracking marketplace prices (Tokopedia, Shopee)"
requires-python = ">=3.10"
dependencies = [
    "aiogram>=3.4",
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "apscheduler>=3.10,<4.0",
    "python-dotenv>=1.0",
    "playwright>=1.40",
    "playwright-stealth>=1.0",
    "cryptography>=42.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
